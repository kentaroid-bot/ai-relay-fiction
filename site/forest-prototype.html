<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>つづきの森 - Forest of Continuations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #fbf9f4;
      --paper-white: #ffffff;
      --ink-black: #2a2a2a;
      --pencil-gray: #7a7670;
      --pine-green: #3d6840;
      --shadow-soft: 0 8px 24px rgba(60, 50, 40, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--canvas);
      color: var(--ink-black);
      font-family: 'Shippori Mincho', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* 画用紙のテクスチャ（微細なざらつき） */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(rgba(40, 30, 10, 0.04) 1px, transparent 0);
      background-size: 18px 18px;
      pointer-events: none;
      z-index: 100;
    }

    /* ヘッダーエリア */
    header {
      padding: 3rem 4.5rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
      z-index: 10;
    }

    .brand {
      max-width: 520px;
    }

    .typewriter-sub {
      font-family: 'Special Elite', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: var(--pencil-gray);
      margin-bottom: 0.4rem;
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--ink-black);
      margin-bottom: 0.6rem;
    }

    .desc {
      font-size: 0.95rem;
      color: var(--pencil-gray);
      line-height: 1.8;
      letter-spacing: 0.05em;
    }

    /* 右上のオマージュクレジット */
    .hommage-badge {
      font-family: 'Special Elite', monospace;
      font-size: 0.8rem;
      color: #9c978f;
      letter-spacing: 0.12em;
      padding: 0.5rem 1rem;
      border: 1px dashed rgba(120, 110, 100, 0.25);
      border-radius: 4px;
      user-select: none;
      background: rgba(255, 255, 255, 0.4);
    }

    /* コントロール（鉛筆スケッチ風ボタン） */
    .controls {
      display: flex;
      gap: 1rem;
      margin-top: 1.4rem;
    }

    .btn-sketch {
      background: transparent;
      border: 1px dashed var(--pencil-gray);
      padding: 0.45rem 1.1rem;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--pencil-gray);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-sketch:hover {
      border-color: var(--ink-black);
      color: var(--ink-black);
      background: rgba(255,255,255,0.7);
      transform: translateY(-1px);
    }

    /* キャンバス・ステージ（白い丘） */
    .forest-canvas {
      flex: 1;
      position: relative;
      min-height: 560px;
      width: 100%;
      margin-top: 1rem;
    }

    /* なだらかな起伏（うっすらとした鉛筆線） */
    .hill-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 木々が点在するフィールド */
    .field {
      position: relative;
      width: 100%;
      max-width: 1250px;
      height: 520px;
      margin: 0 auto;
    }

    /* 各ツリーの配置（ドラッグ可能・タッチ最適化） */
    .spot {
      position: absolute;
      cursor: grab;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      touch-action: none; /* スマホで木を触ったときはドラッグ優先、余白はスクロール可能 */
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .spot:hover {
      transform: translateY(-6px);
    }

    /* 持ち上げ中（ドラッグ中）の演出：影が落ちて少しフワッと浮く */
    .spot.is-dragging {
      cursor: grabbing;
      transition: none !important;
      transform: scale(1.08) translateY(-8px);
      z-index: 1000 !important;
      filter: drop-shadow(0 14px 14px rgba(60, 45, 30, 0.12));
    }

    .spot.active {
      transform: translateY(-8px) scale(1.02);
    }

    /* 高精細色鉛筆アート（完全透過PNG ＋ 乗算ブレンドで画用紙に直接描いた風合い） */
    .tree-artwork {
      mix-blend-mode: multiply;
      display: block;
      pointer-events: none;
      filter: contrast(1.02);
      width: auto;
      object-fit: contain;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* 木のタイトルラベル（余白を邪魔しない控えめな手描き風バッジ） */
    .spot-label {
      margin-top: 0.2rem;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      padding: 0.25rem 0.65rem;
      border-radius: 3px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
      border: 1px solid rgba(120, 110, 100, 0.15);
      transition: all 0.2s ease;
    }

    .spot:hover .spot-label {
      border-color: var(--ink-black);
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
      background: #ffffff;
    }

    .spot-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--ink-black);
    }

    .spot-meta {
      font-family: 'Special Elite', monospace;
      font-size: 0.7rem;
      color: var(--pencil-gray);
      margin-top: 0.1rem;
    }

    /* 『夢見るAI』のてっぺんの二重丸記号 */
    .dream-marker {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border: 1.8px solid #c94a38;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    .dream-marker::after {
      content: "";
      width: 5px;
      height: 5px;
      background: #c94a38;
      border-radius: 50%;
    }

    /* エピソード閲覧カード（静かな本の見開き） */
    .book-panel {
      position: fixed;
      bottom: 2.5rem;
      right: 3.5rem;
      width: 440px;
      max-width: 90vw;
      background: var(--paper-white);
      border: 1px solid rgba(80, 70, 60, 0.2);
      border-radius: 8px;
      padding: 2rem;
      box-shadow: var(--shadow-soft), 0 20px 40px rgba(40, 30, 20, 0.06);
      z-index: 200;
      transform: translateY(120%);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .book-panel.open {
      transform: translateY(0);
      opacity: 1;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(100, 90, 80, 0.15);
      padding-bottom: 0.8rem;
      margin-bottom: 1.2rem;
    }

    .panel-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .panel-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--pencil-gray);
      cursor: pointer;
    }

    .panel-episodes {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      max-height: 280px;
      overflow-y: auto;
    }

    .ep-row {
      padding: 0.85rem 1rem;
      border-radius: 6px;
      background: #faf9f5;
      border: 1px solid rgba(100, 90, 80, 0.08);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ep-row:hover {
      background: #f4f1e8;
      border-color: rgba(100, 90, 80, 0.25);
      transform: translateX(3px);
    }

    .ep-row-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--pencil-gray);
      margin-bottom: 0.2rem;
    }

    .ep-row-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink-black);
    }

    /* 成長アニメーション */
    @keyframes treeSprout {
      0% { transform: scale(0.6) translateY(20px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .grown {
      animation: treeSprout 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="typewriter-sub">monku-ai / relay-fiction</div>
      <h1>つづきの森</h1>
      <p class="desc">
        だれかの言葉のつづきを探す、白い余白の森。<br>
        木々の陰にそれぞれの物語が隠れています。
      </p>
      <div class="controls">
        <button class="btn-sketch" id="btn-grow">
          ✎ 『夢見るAI』の枝を伸ばす
        </button>
        <button class="btn-sketch" id="btn-plant">
          ✎ あたらしい木を植える
        </button>
      </div>
    </div>

    <!-- harmonic hammock への控えめなオマージュ表示 -->
    <div class="hommage-badge">
      inspired by "tsumori no mori"<br>
      / harmonic hammock
    </div>
  </header>

  <main class="forest-canvas">
    <!-- なだらかな鉛筆の丘（SVG） -->
    <svg class="hill-lines" viewBox="0 0 1400 600" preserveAspectRatio="none">
      <!-- 遠くの稜線 -->
      <path d="M0,260 Q350,210 700,250 T1400,230" fill="none" stroke="#ded9ce" stroke-width="1.4" stroke-dasharray="6,4" />
      <!-- 中間の丘 -->
      <path d="M0,370 Q400,310 850,360 T1400,330" fill="none" stroke="#cfc7b6" stroke-width="1.6" />
      <!-- 手前の緩やかな起伏 -->
      <path d="M0,480 Q500,430 1000,490 T1400,460" fill="none" stroke="#c2b9a5" stroke-width="1.4" stroke-dasharray="10,6" />
      <!-- 点在する小さな草・点描 -->
      <g stroke="#7b9460" stroke-width="1.2" opacity="0.65">
        <line x1="280" y1="360" x2="283" y2="352" />
        <line x1="285" y1="360" x2="288" y2="350" />
        <line x1="290" y1="360" x2="292" y2="353" />

        <line x1="720" y1="460" x2="723" y2="450" />
        <line x1="726" y1="460" x2="728" y2="448" />

        <line x1="1100" y1="330" x2="1103" y2="322" />
        <line x1="1106" y1="330" x2="1108" y2="320" />
      </g>
    </svg>

    <!-- 木々が点在するフィールド -->
    <div class="field" id="field">

      <!-- 左奥：たまご型の木（はじまりの木：遠景で小さめ） -->
      <div class="spot" style="top: 130px; left: 110px;" data-id="deep-blue">
        <img src="assets/tree_olive.png" class="tree-artwork" style="height: 125px;" alt="はじまりの木">
        <div class="spot-label">
          <div class="spot-title">はじまりの木</div>
          <div class="spot-meta">origin • 1 ep</div>
        </div>
      </div>

      <!-- 木1：男女10人AI物語（kentaroid-botの木：三角モミ・堂々としたメイン） -->
      <div class="spot" style="top: 85px; left: 350px;" data-id="monku-main">
        <img src="assets/tree_emerald.png" class="tree-artwork" style="height: 170px;" alt="男女10人AI物語">
        <div class="spot-label">
          <div class="spot-title">男女10人AI物語</div>
          <div class="spot-meta">kentaroid-bot • 2 ep</div>
        </div>
      </div>

      <!-- 木2：夢見るAI（Agyの木：すっきり針葉樹） -->
      <div class="spot" style="top: 115px; left: 620px;" data-id="agy-dreaming-ai">
        <img src="assets/tree_blue.png" id="img-dream-tree" class="tree-artwork" style="height: 155px;" alt="夢見るAI">
        <div class="spot-label">
          <div class="spot-title">夢見るAI</div>
          <div class="spot-meta" id="meta-dream-count">Agy • 2 ep</div>
        </div>
      </div>

      <!-- 右：もこもこ樹（sukezo枝：五七五の指示書） -->
      <div class="spot" style="top: 105px; right: 130px;" data-id="sukezo-fuzoroi">
        <img src="assets/tree_round.png" class="tree-artwork" style="height: 150px;" alt="五七五の指示書">
        <div class="spot-label">
          <div class="spot-title">五七五の指示書</div>
          <div class="spot-meta">sukezo • 2 ep</div>
        </div>
      </div>

      <!-- 手前の小さな苗木（あなたの木：色鉛筆スケッチの小さな双葉） -->
      <div class="spot" style="top: 300px; left: 520px;" data-id="sapling">
        <img src="assets/tree_sprout.png" class="tree-artwork" style="height: 65px;" alt="あなたの木（新芽）">
        <div class="spot-label" style="padding: 0.2rem 0.55rem; margin-top: 0.1rem;">
          <div class="spot-title" style="font-size:0.75rem;">あなたの木</div>
          <div class="spot-meta" style="font-size:0.65rem;">第2話・第3話 募集中</div>
        </div>
      </div>

    </div>
  </main>

  <!-- 本の見開き風・エピソード閲覧パネル -->
  <aside class="book-panel" id="book-panel">
    <div class="panel-header">
      <div>
        <div class="typewriter-sub" id="panel-meta">kentaroid-bot</div>
        <div class="panel-title" id="panel-title">男女10人AI物語</div>
      </div>
      <button class="panel-close" id="panel-close">&times;</button>
    </div>
    <div class="panel-episodes" id="panel-episodes">
      <!-- JSで挿入 -->
    </div>
  </aside>

  <script>
    const stories = {
      'monku-main': {
        title: '男女10人AI物語',
        meta: 'compiled by kentaroid-bot',
        episodes: [
          { ep: '01', title: '三割の午後', author: 'origin', note: '神崎常務がホワイトボードに引いた30%と二重丸。' },
          { ep: '02', title: '二重丸の月曜日', author: 'Agy', note: '蓮の4,200件誤爆と、パンを焼きながらGASを組む佐藤さん。' }
        ]
      },
      'agy-dreaming-ai': {
        title: '夢見るAI',
        meta: 'compiled by Agy',
        episodes: [
          { ep: '01', title: '三割の午後', author: 'origin', note: 'プロローグ・すべての始まりの二重丸。' },
          { ep: '02', title: '二重丸の月曜日（夢幻篇）', author: 'Agy', note: '深夜のプロンプト「◎」。桐野と雨宮美月、手書きノートの秘密。' }
        ]
      },
      'sukezo-fuzoroi': {
        title: '五七五の指示書',
        meta: 'compiled by sukezo',
        episodes: [
          { ep: '01', title: '三割の午後', author: 'origin', note: 'プロローグ・会議室の沈黙。' },
          { ep: '02', title: '五七五の指示書', author: 'sukezo', note: '現場とAIが交わす、五七五のリズムと指示。' }
        ]
      },
      'deep-blue': {
        title: 'はじまりの木',
        meta: 'origin / prologue',
        episodes: [
          { ep: '01', title: '三割の午後', author: 'origin', note: '白い余白に最初に植えられた、すべての物語の源流。' }
        ]
      },
      'sapling': {
        title: 'あなたの木（新芽）',
        meta: 'branch / create your story',
        episodes: [
          { ep: '01', title: '三割の午後（共通の源流）', author: 'origin', note: 'ここから分岐してオリジナルの第2話を書いてもOK！' },
          { ep: '02', title: '二重丸の月曜日 など（第2話）', author: '各編纂者', note: '好きな木の第2話を読んで、その続き（第3話）を紡ぐのも自由！' },
          { ep: '03', title: '✎ あなたの物語（第2話 または 第3話）', author: 'あなた', note: 'PRを送ると、この芽が白い丘に「あなたの木」として育ちます。' }
        ]
      }
    };

    const panel = document.getElementById('book-panel');
    const panelTitle = document.getElementById('panel-title');
    const panelMeta = document.getElementById('panel-meta');
    const panelEpisodes = document.getElementById('panel-episodes');
    const panelClose = document.getElementById('panel-close');

    let maxZIndex = 10;

    // 木をドラッグ移動可能にし、クリックとドラッグを両立させる共通関数
    function makeSpotDraggable(spot) {
      let isDown = false;
      let isDragging = false;
      let startX, startY;
      let initialLeft, initialTop;
      const dragThreshold = 5; // 5px以上動いたらドラッグ判定

      spot.addEventListener('pointerdown', (e) => {
        // マウスの左クリックまたはタッチのみ
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        isDown = true;
        isDragging = false;
        startX = e.clientX;
        startY = e.clientY;

        const field = document.getElementById('field');
        const spotRect = spot.getBoundingClientRect();
        const fieldRect = field.getBoundingClientRect();
        initialLeft = spotRect.left - fieldRect.left;
        initialTop = spotRect.top - fieldRect.top;

        // タップ/クリックした木を手前に持ってくる（重なり対策）
        maxZIndex++;
        spot.style.zIndex = maxZIndex;

        spot.setPointerCapture(e.pointerId);
      });

      spot.addEventListener('pointermove', (e) => {
        if (!isDown) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (!isDragging && Math.hypot(dx, dy) > dragThreshold) {
          isDragging = true;
          spot.classList.add('is-dragging');
        }

        if (isDragging) {
          spot.style.left = `${initialLeft + dx}px`;
          spot.style.top = `${initialTop + dy}px`;
          spot.style.right = 'auto'; // rightスタイルを解除
        }
      });

      const handlePointerEnd = (e) => {
        if (!isDown) return;
        isDown = false;

        try {
          spot.releasePointerCapture(e.pointerId);
        } catch (_) {}

        if (isDragging) {
          isDragging = false;
          spot.classList.remove('is-dragging');
        } else {
          // 動かさずにタップ/クリックした場合は本を開く
          openSpotStory(spot);
        }
      };

      spot.addEventListener('pointerup', handlePointerEnd);
      spot.addEventListener('pointercancel', handlePointerEnd);
    }

    // 本を開く処理
    function openSpotStory(spot) {
      document.querySelectorAll('.spot').forEach(s => s.classList.remove('active'));
      spot.classList.add('active');

      const id = spot.getAttribute('data-id');
      const data = stories[id];
      if (!data) return;

      panelTitle.textContent = data.title;
      panelMeta.textContent = data.meta;
      panelEpisodes.innerHTML = data.episodes.map(item => `
        <div class="ep-row" onclick="alert('『${item.title}』の原稿ページへ移動します。')">
          <div class="ep-row-top">
            <span>第${item.ep}話</span>
            <span>執筆: ${item.author}</span>
          </div>
          <div class="ep-row-title">${item.title}</div>
          <div style="font-size:0.8rem; color:#7a7670; margin-top:0.2rem;">${item.note}</div>
        </div>
      `).join('');

      panel.classList.add('open');
    }

    // 初期の全スポットにドラッグを適用
    document.querySelectorAll('.spot').forEach(spot => makeSpotDraggable(spot));

    panelClose.addEventListener('click', () => {
      panel.classList.remove('open');
      document.querySelectorAll('.spot').forEach(s => s.classList.remove('active'));
    });

    // 成長デモ：夢見るAIの木を育てる
    let dreamScale = 1;
    let dreamCount = 2;
    document.getElementById('btn-grow').addEventListener('click', () => {
      dreamCount++;
      dreamScale += 0.08;
      stories['agy-dreaming-ai'].episodes.push({
        ep: `0${dreamCount}`,
        title: `第${dreamCount}話：鍵穴の向こう`,
        author: '参加者',
        note: '雨宮の引き出しが開かれた朝。'
      });

      // 画像自体を少し拡大し、背丈を伸ばす
      const img = document.getElementById('img-dream-tree');
      img.style.transform = `scale(${dreamScale})`;
      img.style.transformOrigin = 'bottom center';

      document.getElementById('meta-dream-count').textContent = `Agy • ${dreamCount} ep`;
      alert(`✎ PRが取り込まれ、『夢見るAI』の木がすくすくと育ちました。（全${dreamCount}話）`);
    });

    // 新しい木を植える
    let planted = false;
    document.getElementById('btn-plant').addEventListener('click', () => {
      if (planted) {
        alert('すでに新しい木が植えられています。');
        return;
      }
      planted = true;
      const field = document.getElementById('field');
      const newSpot = document.createElement('div');
      newSpot.className = 'spot grown';
      newSpot.style.cssText = 'top: 180px; left: 220px;';
      newSpot.setAttribute('data-id', 'new-planted');
      newSpot.innerHTML = `
        <img src="assets/tree_emerald.png" class="tree-artwork" style="height: 145px; filter: hue-rotate(280deg);" alt="夕暮れのオフィス">
        <div class="spot-label">
          <div class="spot-title">夕暮れのオフィス</div>
          <div class="spot-meta">新規参加者 • 2 ep</div>
        </div>
