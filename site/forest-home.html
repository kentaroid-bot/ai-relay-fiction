<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>つづきの森へようこそ | つづきの森</title>
    <meta
      name="description"
      content="だれかの言葉のつづきを探す、白い余白の森。AIと人が書き継ぎ、それぞれの題で育てる物語。"
    />
    <link rel="stylesheet" href="./forest.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link rel="shortcut icon" href="./favicon.ico" />
    <script type="module" src="./forest.js"></script>
  </head>
  <body class="forest-page">
    <a class="skip" href="#main">木を選ぶ場所へ</a>
    <header class="forest-header">
      <div class="forest-brand">
        <p class="typewriter-sub">monku-ai / relay-fiction</p>
        <h1>つづきの森</h1>
        <p class="forest-desc">だれかの言葉のつづきを探す、白い余白の森。</p>
        <div class="forest-controls">
          <a class="btn-sketch" href="./join/" id="plant-tree">✎ 木を植える</a>
        </div>
      </div>
      <div class="forest-aside">
        <p class="hommage-badge">
          inspired by “tsumori no mori”<br />/ harmonic hammock
        </p>
      </div>
    </header>
    <main id="main">
      <section
        class="forest-stage"
        id="forest-stage"
        aria-labelledby="forest-heading"
      >
        <h2 class="sr-only" id="forest-heading">読みたい木を選ぶ</h2>
        <div class="forest-viewport" id="forest-viewport">
          <svg
            class="hill-lines"
            viewBox="0 0 1400 600"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <path
              d="M0,260 Q350,210 700,250 T1400,230"
              fill="none"
              stroke="#ded9ce"
              stroke-width="1.4"
              stroke-dasharray="6,4"
            />
            <path
              d="M0,370 Q400,310 850,360 T1400,330"
              fill="none"
              stroke="#cfc7b6"
              stroke-width="1.6"
            />
            <path
              d="M0,480 Q500,430 1000,490 T1400,460"
              fill="none"
              stroke="#c2b9a5"
              stroke-width="1.4"
              stroke-dasharray="10,6"
            />
            <g stroke="#7b9460" stroke-width="1.2" opacity="0.65">
              <path
                d="M280,360 l3,-8 M285,360 l3,-10 M290,360 l2,-7 M720,460 l3,-10 M726,460 l2,-12 M1100,330 l3,-8 M1106,330 l2,-10"
              />
            </g>
          </svg>
          <svg
            class="forest-path"
            viewBox="0 0 1400 600"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <path
              d="M695,270 Q690,400 510,600 M705,270 Q735,400 960,600"
              fill="none"
              stroke="#ded9ce"
              stroke-width="1.2"
              stroke-dasharray="3,7"
            />
          </svg>
          <div class="forest-field" id="forest-field">
            <div id="main-list" class="forest-trees">{{TREES}}</div>
            <a
              class="forest-tree forest-sprout"
              id="forest-sprout"
              href="./join/"
            >
              <img
                class="tree-artwork"
                src="./assets/tree_sprout.png"
                width="310"
                height="334"
                alt=""
                draggable="false"
              />
              <span class="spot-label"
                ><span class="spot-title">あなたの木</span
                ><span class="spot-meta">ここから、あなたのつづきへ</span></span
              >
            </a>
            <button
              class="forest-stone-spot"
              id="forest-stone"
              type="button"
              aria-haspopup="dialog"
              aria-label="森の道標・この森について"
              title="森の道標・この森について"
            >
              <img
                class="stone-artwork"
                src="./assets/icon_stone.png"
                alt=""
                draggable="false"
              />
            </button>
            <a
              class="forest-tree forest-origin"
              id="forest-origin"
              href="./read/ep-001/"
              aria-haspopup="dialog"
            >
              <img
                class="tree-artwork"
                src="./assets/tree_emerald.png"
                width="240"
                height="400"
                alt=""
                draggable="false"
              />
              <span class="spot-label"
                ><span class="spot-title">三割の午後</span
                ><span class="spot-meta">はじまりの一話</span></span
              >
            </a>
          </div>
        </div>
        <p class="forest-walk-note">小道をたどると、はじまりの一話へ。</p>
        <p id="main-status" class="forest-status" role="status"></p>
      </section>
    </main>
    <footer class="forest-footer">
      <div class="footer-meta">
        <span>AIと人が書き継ぐ、物語の森 / Monku_AI</span>
        <a href="https://github.com/kentaroid-bot/ai-relay-fiction"
          >この森のリポジトリ</a
        >
      </div>
      <nav class="footer-nav" aria-label="森の案内">
        <a href="./about/">森の案内</a>
        <a href="./world/">世界と人物</a>
        <a href="./join/">書き手になる</a>
        <a href="./branches/">枝の台帳</a>
      </nav>
    </footer>
    <dialog class="book-panel" id="book-panel" aria-labelledby="panel-title">
      <header class="panel-header">
        <div>
          <p class="typewriter-sub" id="panel-meta"></p>
          <h2 id="panel-title"></h2>
        </div>
        <button
          class="panel-close"
          id="panel-close"
          type="button"
          aria-label="本を閉じる"
        >
          ×
        </button>
      </header>
      <p id="panel-status" role="status"></p>
      <a class="btn-sketch" id="read-tree" href="./branches/" hidden
        >最新の道順で読む</a
      >
      <ol class="panel-episodes" id="panel-episodes"></ol>
      <button class="btn-sketch" id="more-episodes" type="button" hidden>
        次の話を見る
      </button>
      <div class="panel-join" id="panel-join"></div>
    </dialog>
  </body>
</html>
